name: Daily Backend Job

on:
  schedule:
    # 02:00 BRT = 05:00 UTC
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest

    steps:
      - name: Generate recurring transactions
        run: |
          curl -fsS --max-time 40 -X POST \
            -H "x-api-key: ${{ secrets.CRON_API_KEY }}" \
            https://nomina-be-qico.onrender.com/api/v1/internal/generate-recurring-transactions

      - name: Settle card installments
        run: |
          curl -fsS --max-time 40 -X POST \
            -H "x-api-key: ${{ secrets.CRON_API_KEY }}" \
            https://nomina-be-qico.onrender.com/api/v1/internal/settle-card-installments

      - name: Reconcile balances
        if: always()
        run: |
          curl -fsS --max-time 40 -X POST \
            -H "x-api-key: ${{ secrets.CRON_API_KEY }}" \
            https://nomina-be-qico.onrender.com/api/v1/internal/reconcile-balances
