name: Daily Backend Job

on:
  schedule:
    # 02:00 BRT = 05:00 UTC
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: daily-job
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate recurring transactions
        run: |
          curl -fsS --max-time 40 -X POST \
            -H "x-api-key: ${{ secrets.CRON_API_KEY }}" \
            https://nomina-be-qico.onrender.com/api/v1/internal/generate-recurring-transactions

      - name: Detect recurring suggestions
        id: detect
        continue-on-error: true
        run: |
          curl -fsS --max-time 40 -X POST \
            -H "x-api-key: ${{ secrets.CRON_API_KEY }}" \
            https://nomina-be-qico.onrender.com/api/v1/internal/recurring-suggestions-detect

      - name: Settle card installments
        run: |
          curl -fsS --max-time 40 -X POST \
            -H "x-api-key: ${{ secrets.CRON_API_KEY }}" \
            https://nomina-be-qico.onrender.com/api/v1/internal/settle-card-installments

      - name: Auto-pay card invoices
        run: |
          curl -fsS --max-time 40 -X POST \
            -H "x-api-key: ${{ secrets.CRON_API_KEY }}" \
            https://nomina-be-qico.onrender.com/api/v1/internal/auto-pay-card-invoices

      - name: Reconcile balances
        if: always()
        run: |
          curl -fsS --max-time 40 -X POST \
            -H "x-api-key: ${{ secrets.CRON_API_KEY }}" \
            https://nomina-be-qico.onrender.com/api/v1/internal/reconcile-balances

      - name: Fail when recurring suggestion detection failed
        if: always()
        run: |
          if [ "${{ steps.detect.outcome }}" = "failure" ]; then
            echo "Detect recurring suggestions failed: see the step log above"
            exit 1
          fi
