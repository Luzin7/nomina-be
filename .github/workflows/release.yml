name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  PRODUCTION_HEALTH_URL: https://nomina-be-qico.onrender.com/api/v1/health/ready

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: npm test -- --coverage

      - name: Build application
        run: npm run build

      - name: Check for build artifacts
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed - dist directory not found"
            exit 1
          fi
          echo "Build successful - dist directory created"

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::O secret DATABASE_URL não está configurado neste repositório."
            exit 1
          fi
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::O secret RENDER_DEPLOY_HOOK_URL não está configurado neste repositório."
            exit 1
          fi

      - name: Semantic Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./node_modules/.bin/semantic-release

      - name: Notify when there is no release
        if: steps.release.outputs.version == ''
        run: |
          released_in=""
          for t in $(git tag --list 'v*' --contains "$GITHUB_SHA"); do
            c=$(git rev-list -n1 "$t")
            if [ "$c" = "$GITHUB_SHA" ] || [ "$(git rev-parse "$c^1" 2>/dev/null)" = "$GITHUB_SHA" ]; then
              released_in="$t"; break
            fi
          done
          if [ -n "$released_in" ]; then
            echo "::error::$GITHUB_SHA já saiu em $released_in; re-run não migra nem publica. Corrija com um commit fix: na main."
            exit 1
          fi
          echo "::notice::Sem release: nada migrado, nada publicado"

      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        if: steps.release.outputs.version != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:v${{ steps.release.outputs.version }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.release.outputs.version }}

      - name: Run database migrations
        if: steps.release.outputs.version != ''
        timeout-minutes: 10
        run: npx drizzle-kit migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALLOW_PROD_MIGRATE: '1'

      - name: Deploy image to Render
        if: steps.release.outputs.version != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image_url=$(jq -rn --arg image "$IMAGE" '$image | @uri')
          curl -fsS --max-time 30 --retry 2 -X POST "${RENDER_DEPLOY_HOOK_URL}&imgURL=${image_url}" > /dev/null
          echo "Deploy disparado no Render: $IMAGE"

      - name: Verify new image is live
        if: steps.release.outputs.version != ''
        timeout-minutes: 12
        env:
          HEALTH_URL: ${{ env.PRODUCTION_HEALTH_URL }}
          EXPECTED_SHA: ${{ github.sha }}
          POLL_TIMEOUT_SECONDS: '600'
          POLL_INTERVAL_SECONDS: '10'
        run: |
          set -uo pipefail
          deadline=$((SECONDS + POLL_TIMEOUT_SECONDS))
          body=''
          while [ "$SECONDS" -lt "$deadline" ]; do
            if response=$(curl -sS --max-time 10 -w '\n%{http_code}' "$HEALTH_URL"); then
              status=${response##*$'\n'}
              body=${response%$'\n'*}
              if [ "$status" = "200" ] && [ "$(echo "$body" | jq -r '.commit // empty')" = "$EXPECTED_SHA" ]; then
                echo "Imagem nova no ar: $body"
                exit 0
              fi
            fi
            sleep "$POLL_INTERVAL_SECONDS"
          done
          echo "::error::O commit $EXPECTED_SHA não ficou no ar em ${POLL_TIMEOUT_SECONDS}s em $HEALTH_URL. Último ready: ${body:-sem resposta}"
          exit 1

      - name: Promote image to latest
        if: steps.release.outputs.version != ''
        run: docker buildx imagetools create --tag "${{ steps.image.outputs.name }}:latest" "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"

      - name: Label release pull request
        if: steps.release.outputs.version != ''
        timeout-minutes: 2
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prs=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[] | select(.base.ref=="main") | .number') || { echo "::warning::Falha ao buscar PR da release para ${{ github.sha }}"; exit 0; }
          if [ -z "$prs" ]; then
            echo "Nenhum PR para main associado a ${{ github.sha }}"
            exit 0
          fi
          for pr in $prs; do
            echo "Adicionando label released ao PR #$pr"
            gh pr edit "$pr" --repo "${{ github.repository }}" --add-label released || echo "::warning::Falha ao adicionar label released ao PR #$pr"
          done
