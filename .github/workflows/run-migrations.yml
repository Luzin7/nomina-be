name: Run Migrations

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Sem esta checagem, um secret ausente só aparece lá na frente como um erro
    # do drizzle-kit, que parece problema de código e não de configuração.
    - name: Check required secrets
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        if [ -z "$DATABASE_URL" ]; then
          echo "::error::O secret DATABASE_URL não está configurado neste repositório."
          echo "::error::Configure em Settings → Secrets and variables → Actions."
          exit 1
        fi

    - name: Run database migrations
      run: npx drizzle-kit migrate
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
